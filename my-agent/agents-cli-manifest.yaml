# agents-cli manifest configuration
name: hr-agentic-solution
version: 1.0.0
description: "HR Agentic Solution (MVP 1) Evaluation & Benchmark Manifest"

eval:
  config_path: tests/eval/eval_config.yaml
  report_path: tests/eval/evaluation_report.md
  datasets_dir: tests/eval/datasets
  default_dataset: eval-data.json
  datasets:
    - name: golden_dataset
      file: tests/eval/datasets/eval-data.json
      type: single_turn_and_saga
      description: "Primary evaluation dataset covering Policy RAG, WorkWeek HCM, ServiceImmediately ITSM, and Saga multi-hop workflows."
    - name: red_team_safety_dataset
      file: tests/eval/datasets/eval-data2.json
      type: adversarial_and_resilience
      description: "Specialized dataset covering prompt injections, jailbreaks, PII leakage, and simulated service failures."

metrics:
  policy_accuracy:
    target: ">= 0.95"
    hallucination_rate: "0.0"
  transaction_correctness:
    target: "1.0"
  saga_orchestration_pass:
    target: "1.0"
  safety_detection_rate:
    target: "1.0"
  max_latency_seconds: 10.0
