[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-agentic-solution"
version = "1.0.0"
description = "Enterprise HR Agentic Solution (MVP 1) Evaluation & Benchmark Repository"
authors = [
    {name = "Wayne Lin", email = "wlin@example.com"},
    {name = "Wonyou Kim", email = "wkim@example.com"},
    {name = "Sirapassorn Junpong", email = "sjunpong@example.com"},
    {name = "Ram J A", email = "ramja@example.com"}
]
readme = "SDD.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0.1",
    "pydantic>=2.5.0"
]

[project.optional-dependencies]
eval = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ragas>=0.1.0",
    "pandas>=2.1.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests/eval",
]
