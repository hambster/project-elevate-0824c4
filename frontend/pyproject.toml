[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-assistant-frontend"
version = "1.0.0"
description = "Decoupled Web Frontend UI Service for Enterprise HR Agentic Solution (MVP 1)"
authors = [
    {name = "Wayne Lin", email = "wlin@example.com"},
    {name = "Wonyou Kim", email = "wkim@example.com"},
    {name = "Sirapassorn Junpong", email = "sjunpong@example.com"},
    {name = "Ram J A", email = "ramja@example.com"}
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "httpx>=0.26.0"
]
